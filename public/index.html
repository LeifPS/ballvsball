<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#79ad66">
<title>Ball gegen Ball</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/CaveatBrush.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/PatrickHand.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>
// Vorschau-Seite (preview.ballvsball...): eigenes Favicon mit "P" und rosa Ball, damit man sie sofort erkennt
if (/(^|[.-])preview([.-]|$)/.test(location.hostname)) {
  document.querySelectorAll('link[rel=icon]').forEach(function (l) { l.href = l.type === 'image/svg+xml' ? '/favicon-preview.svg' : '/favicon-preview-32.png'; });
  var at = document.querySelector('link[rel=apple-touch-icon]'); if (at) at.href = '/apple-touch-icon-preview.png';
  var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = '#ff5ad0';
  document.title = '[Vorschau] ' + document.title;
}
</script>
</head>
<body>
<div id="app"><div id="screen"><p class="boot">Lade ...</p></div></div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<button id="snd" aria-label="Ton"></button>
<script type="module" src="/js/ui.js"></script>
</body>
</html>
