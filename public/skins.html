<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skin-Vorschau - Ball gegen Ball</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:#79ad66;padding:10px 12px 40px;max-width:1200px;margin:0 auto}
  h1{margin:8px 0 2px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
  .bar .btn,.card .btn{display:inline-block;width:auto;min-height:36px;padding:2px 12px;font-size:19px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:var(--paper,#f6efd9);border:2.5px solid var(--ink,#1d2742);border-radius:14px;padding:8px;box-shadow:2px 3px 0 var(--ink,#1d2742)}
  .card h3{margin:0;display:flex;justify-content:space-between;align-items:center}
  .card canvas{display:block;width:100%;height:auto;border-radius:8px;margin:6px 0;background:#e9dfc2}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
  .chips span{font-size:14px;border:1.5px solid var(--ink,#1d2742);border-radius:8px;padding:0 7px;background:#fff8}
  .btns{display:flex;flex-wrap:wrap;gap:5px}
  .small{font-size:15px}
  #info{font-size:16px;margin:4px 0}
  .missing{color:#a33;border-color:#a33}
  .tile{display:block;text-align:center;padding:4px;border:2.5px solid var(--ink,#1d2742);border-radius:12px;background:var(--paper,#f6efd9);cursor:pointer;font:inherit}
  .tile.on{outline:4px solid #ffd45a}
  .tile canvas{width:100%;height:auto;background:transparent;margin:0}
  .tile .nm{font:400 20px var(--f-display)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
</style>
</head>
<body>
<h1 class="jit">Skin-Vorschau</h1>
<p id="info">Alle Skins laufen live im echten Kampf gegen eine Puppe. Mit den Knöpfen kannst du Effekte und Töne gezielt abspielen. Töne brauchen einmal einen Klick auf „Ton an“.</p>
<div class="bar" id="bar"></div>
<div class="card" id="main">
  <h3 id="mtitle"></h3>
  <div class="chips" id="mchips"></div>
  <p class="small" id="mdesc" style="margin:2px 0 6px"></p>
  <canvas id="mcv" width="560" height="560" style="max-width:560px;margin:0 auto"></canvas>
  <div class="btns" id="mbtns"></div>
  <div class="btns" id="mrow" style="margin-top:6px;align-items:center"></div>
</div>
<h2 style="margin:14px 0 6px">Alle Skins</h2>
<div class="grid" id="grid"></div>
<script type="module">
import { createSim, stepSim, DEFS, DT } from './js/engine.js';
import { SKINS } from './js/skins.js';
import { drawArena } from './js/render.js';
import { drawBall, addFx, skinStartFx, fxState, clearFx } from './js/art.js';
import { unlock, sfx, setModeTemp, hasSfx } from './js/audio.js';
import { RARITY } from './js/balls.js';

const FEAT = ['Farbschema', 'Modell', 'Partikel', 'Angriffseffekte', 'Animationen', 'Geräusche', 'Todeseffekt', 'Starteffekt'];
const FEAT_BY = { gewoehnlich: [0], selten: [0, 2], episch: [0, 1, 2, 3], legendaer: [0, 1, 2, 3, 4], mythisch: [0, 1, 2, 3, 4, 5, 6, 7] };
let soundOn = false, rarFilter = 'all', sel = SKINS[SKINS.length - 1];
const $ = id => document.getElementById(id);
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

/* ---- Kopfleiste ---- */
const bar = $('bar'), sndBtn = mk('button', 'btn pri', 'Ton an');
const markMissing = () => document.querySelectorAll('[data-snd]').forEach(b => { const miss = !hasSfx(b.dataset.snd); b.classList.toggle('missing', miss); b.title = miss ? 'Audiodatei fehlt noch, es spielt ein Ersatzton' : ''; });
const setSound = on => { unlock(); soundOn = on; setModeTemp(on ? 1 : 0); sndBtn.textContent = on ? 'Ton aus' : 'Ton an'; setTimeout(markMissing, 1500); };
sndBtn.onclick = () => { setSound(!soundOn); if (soundOn) sfx('click'); };
bar.appendChild(sndBtn);
[['all', 'Alle'], ...Object.keys(RARITY).map(k => [k, RARITY[k].name])].forEach(([k, n]) => { const b = mk('button', 'btn', n); b.onclick = () => { rarFilter = k; tiles(); }; bar.appendChild(b); });

/* ---- Große Vorschau: echter Kampf gegen eine Puppe ---- */
const main = $('main'), mcv = $('mcv'), mg = mcv.getContext('2d'), mbtns = $('mbtns'), mrow = $('mrow');
let sim = null, age = 0, acc = 0, tm = 0, hide = 0;
const me = () => sim.balls.find(b => b.slot === 0), dummy = () => sim.balls.find(b => b.slot === 1);
function reset() {
  sim = createSim({ seed: 3 + Math.floor(Math.random() * 999), total: 2, balls: [{ slot: 0, type: sel.base, skin: sel.id, team: 0, deg: 20 }, { slot: 1, type: 'ramm', team: 1, deg: 200 }] });
  age = 0; hide = 0; clearFx();
}
function select(sk) {
  sel = sk; const d = DEFS[sk.id];
  $('mtitle').innerHTML = d.name + ' <span class="small" style="color:' + RARITY[sk.rarity].color + '">' + RARITY[sk.rarity].name + ' - Skin für ' + DEFS[sk.base].name + '</span>';
  $('mchips').innerHTML = FEAT_BY[sk.rarity].map(i => '<span>' + FEAT[i] + '</span>').join('');
  $('mdesc').textContent = d.desc;
  mbtns.innerHTML = ''; mrow.innerHTML = '';
  const add = (label, fn, host) => { const b = mk('button', 'btn', label); b.onclick = () => { unlock(); fn(); }; (host || mbtns).appendChild(b); return b; };
  add('Neu starten', reset);
  add('Starteffekt', () => { reset(); skinStartFx(sim); });
  add('Kontakt-Treffer', () => { const b = me(), t = dummy(); b.x = t.x - b.r - t.r - 4; b.y = t.y; addFx({ k: 'skinhit', x: t.x, y: t.y, a: 0, e: sk.id }); });
  add('Geschoss', () => { const b = me(), t = dummy(); addFx({ k: 'skincast', x: b.x, y: b.y, a: 0, e: sk.id }); const dx = t.x - b.x, dy = t.y - b.y, l = Math.hypot(dx, dy) || 1; sim.objs.push({ k: 'bullet', team: 0, owner: b.id, x: b.x, y: b.y, vx: dx / l * 230, vy: dy / l * 230, r: 5, dmg: 1, life: 3, proj: true, cd: {}, dead: false }); });
  add('Heilung', () => { const b = me(); addFx({ k: 'heal', x: b.x, y: b.y - 6, a: 10, e: sk.id }); });
  add('Todeseffekt', () => { const b = me(); addFx({ k: 'die', x: b.x, y: b.y, a: b.r, e: sk.id }); hide = 1.6; });
  if (sk.snd) {
    mrow.appendChild(mk('div', 'small', 'Töne dieses Skins:'));
    [['cast', 'Zauber'], ['hit', 'Treffer'], ['start', 'Start'], ['die', 'Tod']].forEach(([k, n]) => {
      const name = sk.snd[k]; if (!name) return;
      const b = add(n, () => { if (!soundOn) setSound(true); sfx(name, 1); }, mrow);
      b.dataset.snd = name;
    });
    mrow.appendChild(mk('div', 'small', 'Nach dem Klick auf „Ton an“ werden Knöpfe rot, wenn die Audiodatei noch fehlt (dann spielt ein Ersatzton).'));
  } else mrow.appendChild(mk('div', 'small', 'Dieser Skin hat keine eigenen Geräusche (ab Mythisch).'));
  reset();
  document.querySelectorAll('.tile').forEach(t => t.classList.toggle('on', t.dataset.id === sk.id));
}

/* ---- Kacheln: jeder Skin animiert (Teilfarben, Partikel, Animationen) ---- */
const tl = [];
function tiles() {
  const g = $('grid'); g.innerHTML = ''; tl.length = 0;
  for (const sk of SKINS) {
    if (rarFilter !== 'all' && sk.rarity !== rarFilter) continue;
    const t = mk('button', 'tile' + (sk === sel ? ' on' : ''), ''); t.dataset.id = sk.id;
    const cv = mk('canvas'); cv.width = 240; cv.height = 240; t.appendChild(cv);
    t.appendChild(mk('div', 'nm', DEFS[sk.id].name)); t.appendChild(mk('div', 'small', '<span style="color:' + RARITY[sk.rarity].color + '">' + RARITY[sk.rarity].name + '</span>'));
    t.onclick = () => { select(sk); main.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    g.appendChild(t);
    const s2 = createSim({ seed: 1, total: 2, balls: [{ slot: 0, type: sk.base, skin: sk.id, team: 0, deg: 20 }, { slot: 1, type: 'ramm', team: 1, deg: 200 }] });
    const b = s2.balls[0]; b.x = 63; b.y = 66; b.vx = 90; b.vy = 40;
    tl.push({ cv, sim: s2, b, g: cv.getContext('2d') });
  }
}

let last = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t; tm += dt; frame++;
  age += dt; if (age > 22) reset();
  acc += dt; let n = 0;
  while (acc >= DT && n++ < 6) { stepSim(sim); acc -= DT; for (const b of sim.balls) { b.hp = Math.max(b.hp, b.maxHp * .6); } sim.over = false; }
  if (hide > 0) { hide -= dt; }
  mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, mcv.width, mcv.height);
  const m0 = me(); if (hide > 0 && m0) m0.dead = true;
  drawArena(mg, 10, 10, mcv.width - 20, sim, Math.floor(tm * 7), tm, dt, 0, [{ slot: 0, team: 0, name: 'A' }, { slot: 1, team: 1, name: 'B' }], { noBars: true });
  if (m0) m0.dead = false;
  for (const s2 of fxState.sound) if (soundOn) sfx(s2[0], s2[1]); fxState.sound.length = 0;
  for (const c of tl) { c.g.setTransform(1, 0, 0, 1, 0, 0); c.g.clearRect(0, 0, 240, 240); c.g.scale(1.9, 1.9); c.g.translate(0, 0); drawBall(c.g, c.b, c.sim, Math.floor(tm * 7), tm); }
  requestAnimationFrame(loop);
}
tiles(); select(sel);
requestAnimationFrame(loop);
</script>
</body>
</html>
